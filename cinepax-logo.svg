  <!-- ===== wordmark, letters alternating bright/dim like a chase-lit sign ===== -->
  <text x="360" y="178" text-anchor="middle" class="wordmark" font-size="96" letter-spacing="6">
    <tspan fill="#f2c169">C</tspan><tspan fill="#f3ead8">I</tspan><tspan fill="#f2c169">N</tspan><tspan fill="#f3ead8">E</tspan><tspan fill="#f2c169">P</tspan><tspan fill="#f3ead8">A</tspan><tspan fill="#f2c169">X</tspan>
  </text>

  <!-- dot of the "I" swapped for a glowing marquee bulb -->
  <circle cx="278" cy="102" r="8" fill="url(#dotGlow)"/>
  <circle cx="278" cy="102" r="4.2" fill="#f2c169" filter="url(#bulbGlow)"/>

  <!-- ===== tagline ===== -->
  <text x="360" y="215" text-anchor="middle" class="tagline" font-size="15" letter-spacing="5" fill="#5fa3af">LOVE · LIFE · FILLUMS</text>
