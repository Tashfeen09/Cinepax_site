<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 696 256" width="696" height="256">
  <defs>
    <style>
      .wordmark { font-family: 'Bebas Neue', sans-serif; font-weight: 400; }
      .tagline  { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
    </style>

    <clipPath id="boardClip">
      <rect x="24" y="24" width="672" height="232" rx="22"/>
    </clipPath>

    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#f3ead8" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#f3ead8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#f3ead8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="curtainL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a13355"/>
      <stop offset="100%" stop-color="#5e1730"/>
    </linearGradient>
    <linearGradient id="curtainR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a13355"/>
      <stop offset="100%" stop-color="#5e1730"/>
    </linearGradient>

    <filter id="bulbGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c169" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f2c169" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== signboard ===== -->
  <rect x="24" y="24" width="672" height="232" rx="22" fill="#0f0b16" stroke="#17111f" stroke-width="2"/>

  <g clip-path="url(#boardClip)">
    <!-- subtle vertical vignette so the board doesn't read flat -->
    <rect x="24" y="24" width="672" height="232" fill="#17111f" opacity="0.35"/>

    <!-- velvet curtain draped in from each top corner -->
    <path d="M24,24 L150,24 C110,55 70,70 24,90 Z" fill="url(#curtainL)"/>
    <path d="M24,24 L150,24 C110,55 70,70 24,90 Z" fill="none" stroke="#7d1f3f" stroke-width="1" opacity="0.5"/>
    <path d="M70,30 C95,48 110,58 96,90" fill="none" stroke="#5e1730" stroke-width="2" opacity="0.6"/>
    <path d="M45,26 C68,45 80,56 66,86" fill="none" stroke="#5e1730" stroke-width="2" opacity="0.5"/>

    <path d="M696,24 L570,24 C610,55 650,70 696,90 Z" fill="url(#curtainR)"/>
    <path d="M696,24 L570,24 C610,55 650,70 696,90 Z" fill="none" stroke="#7d1f3f" stroke-width="1" opacity="0.5"/>
    <path d="M650,30 C625,48 610,58 624,90" fill="none" stroke="#5e1730" stroke-width="2" opacity="0.6"/>
    <path d="M675,26 C652,45 640,56 654,86" fill="none" stroke="#5e1730" stroke-width="2" opacity="0.5"/>

    <!-- projector spotlight sweeping across the sign -->
    <polygon points="24,24 260,24 696,256 460,256" fill="url(#beam)"/>
  </g>

